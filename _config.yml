title: "Felipe Labra Irribarra"
author: "Felipe Labra Irribarra"
description: "Pontificia Universidad Católica de Chile"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

# Layout

show_excerpts: false             # show article excerpts instead of archive list on the home page
show_frame: true                # display a grey frame on large screens
show_sidebar: true             # show a sidebar instead of the usual header
show_minimal: false             # remove all clutter

#show_frame: "/assets/images/background.svg"

# Menu                          # for available icons see https://fontawesome.com/v5/icons/

navigation:                     # accepts {file, title, url, icon, sidebaricon}
  - {file: "archive.html", sidebaricon: home}
  - {file: "aboutme.md", sidebaricon: address-card}
  - {title: "CV", file: "CV.md", icon: home}
  - {title: "Research, file: "research.md"}
  #- {title: "Seminars", file: "seminars.md", sidebaricon: "calendar"}
  - {title: "Seminars", file: "indexseminar.md", sidebaricon: "calendar"}


collections:
  seminars:
    output: true
    permalink: /seminars/:name/




